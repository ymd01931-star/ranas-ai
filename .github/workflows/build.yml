
name: Build RANAS AI APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: unzip -o ranas-ai-project.zip -d .

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fix Java and Kotlin targets
        working-directory: GENIUS_AI/android
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle")
          s = p.read_text()

          marker = "        versionName '1.0.0'\n    }\n}"
          replacement = """        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}"""

          if marker not in s:
              raise SystemExit("Could not find expected section in app/build.gradle")

          p.write_text(s.replace(marker, replacement, 1))
          print("Java and Kotlin targets updated to 17")
          PY

      - name: Build APK
        working-directory: GENIUS_AI/android
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RANAS-AI-APK
          path: GENIUS_AI/android/app/build/outputs/apk/debug/*.apk
